{% extends "layout.html" %} {% block title %} BibTeX Fetcher {% endblock %} {%
block body %}

{% include "links.html" %}

<h2>App</h2>

<form method="get" role="search">
  <label for="search-input">Search book</label>
  <input
    type="search"
    id="search-input"
    name="q"
    placeholder="Search..."
    required
  />
  <button type="submit">Search</button>
</form>

{% if books %}
    <h3>Search results</h3>

    {% for book in books %}
        <div>
            <h4>{{ book.title }}</h4>
        </div>
    {% endfor %}
{% elif search_name %}
    <p>No books found.</p>
{% endif %}

{% endblock %}
